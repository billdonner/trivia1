<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Trivia Path Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f0f0f0;
    }
    #game-container {
      max-width: 800px;
      margin: auto;
      position: relative;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    #status {
      margin-top: 10px;
      font-size: 18px;
      text-align: center;
    }
    #board-container {
      text-align: center;
    }
    table {
      border-collapse: collapse;
      margin: auto;
    }
    td.cell {
      width: 60px;
      height: 60px;
      border: 1px solid #ccc;
      vertical-align: middle;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s, border 0.3s;
    }
    td.blacked-out {
      background-color: black !important;
      color: white;
    }
    td.played-correct {
      border: 3px solid green;
    }
    td.played-incorrect {
      background-color: black;
      color: white;
    }
    /* Modal styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: #fefefe;
      margin: 10% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 400px;
      text-align: center;
      border-radius: 8px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    /* Flash animation */
    .flash {
      animation: flashAnimation 0.3s ease-in-out;
    }
    @keyframes flashAnimation {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
    /* Fixed buttons for feedback and settings */
    #feedback-button {
      position: fixed;
      bottom: 10px;
      right: 10px;
      padding: 10px 20px;
      font-size: 14px;
    }
    #settings-link {
      position: fixed;
      bottom: 10px;
      left: 10px;
      padding: 10px 20px;
      font-size: 14px;
      text-decoration: none;
      background: #ddd;
      color: black;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <h1>Advanced Trivia Path Game</h1>
    </header>
    <div id="status">Time: 60 sec | Score: 0</div>
    <div id="board-container"></div>
  </div>

  <!-- Question Modal -->
  <div id="question-modal" class="modal">
    <div class="modal-content" id="question-modal-content">
      <div id="question-text" class="scrollable"></div>
      <div id="answers-container"></div>
      <button id="switch-button">Switch Question</button>
      <div id="question-timer"></div>
    </div>
  </div>

  <!-- Win Modal -->
  <div id="win-modal" class="modal">
    <div class="modal-content">
      <h2 id="win-message"></h2>
      <div id="win-stats"></div>
      <button id="play-again-button">Play Again</button>
      <a href="settings.html">Settings</a>
    </div>
  </div>

  <!-- Lose Modal -->
  <div id="lose-modal" class="modal">
    <div class="modal-content">
      <h2 id="lose-message"></h2>
      <div id="lose-stats"></div>
      <button id="play-again-button-lose">Play Again</button>
      <a href="settings.html">Settings</a>
    </div>
  </div>

  <!-- Feedback button (always visible) -->
  <button id="feedback-button" onclick="alert('Feedback form placeholder');">Feedback</button>
  <!-- Settings link -->
  <a id="settings-link" href="settings.html">Settings</a>

  <script>
    /***********************
     * Global Settings & State
     ***********************/
    const settings = {
      gridSize: 4,                   // default grid size (4x4); can be 3 to 8 (set in settings page)
      blackOutMin: 0.15,             // 15%
      blackOutMax: 0.30,             // 30%
      specialMin: 0.10,              // 10%
      specialMax: 0.15,              // 15%
      switchTimeout: 3000,           // x = 3 seconds (before switch icon flashes)
      feedbackTimeout: 5000,         // y = 5 seconds (duration of answer feedback)
      timerDuration: 60              // overall game timer in seconds
    };

    // Game state variables
    let board = [];                   // 2D array representing the board
    let timerInterval;
    let timeRemaining = settings.timerDuration;
    let score = 0;
    let correctCount = 0, incorrectCount = 0;
    let startCell = null;             // cell chosen to start the game (must be a corner)
    let targetCell = null;            // the diagonal opposite of startCell (winning goal)
    let lastPlayedCell = null;        // the last cell that was played
    let gameStarted = false;          // flag to check if starting move has been made

    /***********************
     * Dummy Question Generator
     ***********************/
    function generateDummyQuestion() {
      const sampleQuestions = [
        {
          question: "What is 2 + 2?",
          answers: ["3", "4", "5", "6"],
          correct: "4",
          difficulty: "easy",
          topic: "Math"
        },
        {
          question: "What is the capital of France?",
          answers: ["Paris", "London", "Berlin", "Rome"],
          correct: "Paris",
          difficulty: "easy",
          topic: "Geography"
        },
        {
          question: "Which planet is known as the Red Planet?",
          answers: ["Earth", "Mars", "Jupiter", "Venus"],
          correct: "Mars",
          difficulty: "easy",
          topic: "Science"
        },
        {
          question: "Who wrote 'Hamlet'?",
          answers: ["Shakespeare", "Tolstoy", "Hemingway", "Dostoevsky"],
          correct: "Shakespeare",
          difficulty: "hard",
          topic: "Literature"
        }
      ];
      return sampleQuestions[Math.floor(Math.random() * sampleQuestions.length)];
    }

    /***********************
     * Board & Cell Creation
     ***********************/
    // Each cell is an object with its properties.
    function createCell(row, col) {
      const q = generateDummyQuestion();
      return {
        row: row,
        col: col,
        blackedOut: false,
        special: false,
        question: q.question,
        answers: q.answers,
        correct: q.correct,
        difficulty: q.difficulty,
        topic: q.topic,
        played: false,
        correctAnswered: null  // will be true/false when answered
      };
    }

    // Generate the board in advance (with random blacked-out and special cells)
    function generateBoard() {
      const N = settings.gridSize;
      board = [];
      for (let i = 0; i < N; i++) {
        const row = [];
        for (let j = 0; j < N; j++) {
          row.push(createCell(i, j));
        }
        board.push(row);
      }
      // Determine total cells (excluding corners when blacking out)
      const totalCells = N * N;
      const minBlacks = Math.floor(totalCells * settings.blackOutMin);
      const maxBlacks = Math.floor(totalCells * settings.blackOutMax);
      const numBlacks = Math.floor(Math.random() * (maxBlacks - minBlacks + 1)) + minBlacks;

      // Get list of positions (excluding the four corners)
      const positions = [];
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if ((i === 0 && j === 0) ||
              (i === 0 && j === N - 1) ||
              (i === N - 1 && j === 0) ||
              (i === N - 1 && j === N - 1)) {
            continue;
          }
          positions.push({ row: i, col: j });
        }
      }
      // Shuffle and mark cells as blacked out
      positions.sort(() => Math.random() - 0.5);
      for (let k = 0; k < numBlacks && k < positions.length; k++) {
        const pos = positions[k];
        board[pos.row][pos.col].blackedOut = true;
      }

      // Mark special cells randomly among non-blacked-out cells.
      const minSpecials = Math.floor(totalCells * settings.specialMin);
      const maxSpecials = Math.floor(totalCells * settings.specialMax);
      const numSpecials = Math.floor(Math.random() * (maxSpecials - minSpecials + 1)) + minSpecials;

      const availablePositions = [];
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if (!board[i][j].blackedOut) {
            availablePositions.push({ row: i, col: j });
          }
        }
      }
      availablePositions.sort(() => Math.random() - 0.5);
      for (let k = 0; k < numSpecials && k < availablePositions.length; k++) {
        const pos = availablePositions[k];
        board[pos.row][pos.col].special = true;
      }

      // Ensure connectivity among the two diagonal pairs (so every grid can be solved)
      // We require that (top-left ⇔ bottom-right) AND (top-right ⇔ bottom-left) are connected.
      while (!checkConnectivity()) {
        // If not, reset blacked-out and special assignments and try again.
        for (let i = 0; i < N; i++) {
          for (let j = 0; j < N; j++) {
            board[i][j].blackedOut = false;
            board[i][j].special = false;
          }
        }
        positions.sort(() => Math.random() - 0.5);
        for (let k = 0; k < numBlacks && k < positions.length; k++) {
          const pos = positions[k];
          board[pos.row][pos.col].blackedOut = true;
        }
        availablePositions.length = 0;
        for (let i = 0; i < N; i++) {
          for (let j = 0; j < N; j++) {
            if (!board[i][j].blackedOut) {
              availablePositions.push({ row: i, col: j });
            }
          }
        }
        availablePositions.sort(() => Math.random() - 0.5);
        for (let k = 0; k < numSpecials && k < availablePositions.length; k++) {
          const pos = availablePositions[k];
          board[pos.row][pos.col].special = true;
        }
      }
    }

    // Check connectivity for both diagonal pairs using BFS.
    // We treat only non-blacked-out cells as available.
    function checkConnectivity() {
      const N = settings.gridSize;
      function bfs(startRow, startCol, targetRow, targetCol) {
        const visited = Array.from({ length: N }, () => Array(N).fill(false));
        const queue = [];
        queue.push({ row: startRow, col: startCol });
        visited[startRow][startCol] = true;
        const directions = [
          { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
          { dr: 0, dc: -1 }, { dr: 0, dc: 1 },
          { dr: -1, dc: -1 }, { dr: -1, dc: 1 },
          { dr: 1, dc: -1 }, { dr: 1, dc: 1 }
        ];
        while (queue.length) {
          const cell = queue.shift();
          if (cell.row === targetRow && cell.col === targetCol) return true;
          for (let d of directions) {
            const nr = cell.row + d.dr;
            const nc = cell.col + d.dc;
            if (nr >= 0 && nr < N && nc >= 0 && nc < N && !visited[nr][nc]) {
              if (!board[nr][nc].blackedOut) {
                visited[nr][nc] = true;
                queue.push({ row: nr, col: nc });
              }
            }
          }
        }
        return false;
      }
      // Check top-left to bottom-right
      if (!bfs(0, 0, N - 1, N - 1)) return false;
      // Check top-right to bottom-left
      if (!bfs(0, N - 1, N - 1, 0)) return false;
      return true;
    }

    /***********************
     * Rendering the Board
     ***********************/
    function renderBoard() {
      const boardContainer = document.getElementById("board-container");
      boardContainer.innerHTML = "";
      const N = settings.gridSize;
      const table = document.createElement("table");
      table.id = "game-board";
      for (let i = 0; i < N; i++) {
        const tr = document.createElement("tr");
        for (let j = 0; j < N; j++) {
          const td = document.createElement("td");
          td.id = `cell-${i}-${j}`;
          td.classList.add("cell");
          td.style.backgroundColor = getColorForTopic(board[i][j].topic);
          if (board[i][j].blackedOut) {
            td.classList.add("blacked-out");
            td.textContent = "";
          } else {
            // For demo, show the first two letters of the topic.
            td.textContent = board[i][j].topic.slice(0, 2).toUpperCase();
          }
          td.addEventListener("click", () => handleCellClick(i, j));
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
      boardContainer.appendChild(table);
    }

    // Generate a color from a default set based on topic.
    function getColorForTopic(topic) {
      const colors = ["#AEDFF7", "#FFC0CB", "#98FB98", "#FFFACD", "#DDA0DD"];
      let hash = 0;
      for (let i = 0; i < topic.length; i++) {
        hash = topic.charCodeAt(i) + ((hash << 5) - hash);
      }
      return colors[Math.abs(hash) % colors.length];
    }

    /***********************
     * Handling Cell Clicks & Moves
     ***********************/
    function handleCellClick(row, col) {
      const cell = board[row][col];
      // For the first move, enforce that only a corner is selectable.
      if (!gameStarted) {
        if (!isCorner(row, col)) {
          alert("Please select a corner cell to start the game.");
          return;
        }
        startCell = { row, col };
        targetCell = getDiagonalOpposite(row, col);
        gameStarted = true;
        lastPlayedCell = { row, col };
        showQuestionModal(row, col);
      } else {
        // Subsequent moves: only allow adjacent cells (touching sides or corners).
        if (!isAdjacent(lastPlayedCell.row, lastPlayedCell.col, row, col)) {
          alert("Please select a cell adjacent to the last played cell.");
          return;
        }
        // If the cell has already been played, simply ignore (or you could show its info).
        if (board[row][col].played) return;
        lastPlayedCell = { row, col };
        showQuestionModal(row, col);
      }
    }

    function isCorner(row, col) {
      const N = settings.gridSize;
      return (row === 0 && col === 0) ||
             (row === 0 && col === N - 1) ||
             (row === N - 1 && col === 0) ||
             (row === N - 1 && col === N - 1);
    }

    function getDiagonalOpposite(row, col) {
      const N = settings.gridSize;
      if (row === 0 && col === 0) return { row: N - 1, col: N - 1 };
      if (row === 0 && col === N - 1) return { row: N - 1, col: 0 };
      if (row === N - 1 && col === 0) return { row: 0, col: N - 1 };
      if (row === N - 1 && col === N - 1) return { row: 0, col: 0 };
    }

    function isAdjacent(r1, c1, r2, c2) {
      return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1;
    }

    /***********************
     * Question Modal & Answer Processing
     ***********************/
    function showQuestionModal(row, col) {
      const cell = board[row][col];
      // Do nothing if cell is already blacked out.
      if (cell.blackedOut) return;

      // Set up modal content.
      document.getElementById("question-text").textContent = cell.question;
      const answersContainer = document.getElementById("answers-container");
      answersContainer.innerHTML = "";
      cell.answers.forEach(answer => {
        const btn = document.createElement("button");
        btn.textContent = answer;
        btn.addEventListener("click", () => processAnswer(row, col, answer));
        answersContainer.appendChild(btn);
      });

      // Show the modal.
      document.getElementById("question-modal").style.display = "block";

      // After 3 seconds (x seconds), flash the switch button.
      setTimeout(() => {
        document.getElementById("switch-button").classList.add("flash");
      }, settings.switchTimeout);
    }

    // Process the answer selection.
    function processAnswer(row, col, selected) {
      const cell = board[row][col];
      // Remove any flashing on the switch button.
      document.getElementById("switch-button").classList.remove("flash");

      if (selected === cell.correct) {
        // Correct answer.
        cell.played = true;
        cell.correctAnswered = true;
        score += (cell.difficulty === "hard" ? 2 : 1);
        correctCount++;
        document.getElementById(`cell-${row}-${col}`).classList.add("played-correct");

        // Special cell: if answered correctly, randomly reactivate a blacked-out cell.
        if (cell.special) {
          reactivateRandomCell();
        }
        // Check if the played cells form a winning path.
        if (checkWinPath()) {
          winGame();
          return;
        }
      } else {
        // Incorrect answer.
        cell.played = true;
        cell.correctAnswered = false;
        incorrectCount++;
        // Black out this cell.
        cell.blackedOut = true;
        document.getElementById(`cell-${row}-${col}`).classList.add("played-incorrect");

        // Special cell: if answered incorrectly, black out another random normal cell.
        if (cell.special) {
          blackOutRandomCell();
        }
      }
      updateStatus();
      // Leave the modal visible for 5 seconds (y seconds) then close.
      setTimeout(closeQuestionModal, settings.feedbackTimeout);
    }

    function closeQuestionModal() {
      document.getElementById("question-modal").style.display = "none";
    }

    // Reactivate a random blacked-out (but not yet played) cell.
    function reactivateRandomCell() {
      const candidates = [];
      const N = settings.gridSize;
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          const cell = board[i][j];
          if (cell.blackedOut && !cell.played) {
            candidates.push({ row: i, col: j });
          }
        }
      }
      if (candidates.length > 0) {
        const rand = candidates[Math.floor(Math.random() * candidates.length)];
        board[rand.row][rand.col].blackedOut = false;
        const td = document.getElementById(`cell-${rand.row}-${rand.col}`);
        td.classList.remove("blacked-out");
        flashCell(td, 3);
      }
    }

    // Black out a random normal (unplayed) cell.
    function blackOutRandomCell() {
      const candidates = [];
      const N = settings.gridSize;
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          const cell = board[i][j];
          if (!cell.blackedOut && !cell.played) {
            candidates.push({ row: i, col: j });
          }
        }
      }
      if (candidates.length > 0) {
        const rand = candidates[Math.floor(Math.random() * candidates.length)];
        board[rand.row][rand.col].blackedOut = true;
        const td = document.getElementById(`cell-${rand.row}-${rand.col}`);
        td.classList.add("blacked-out");
        flashCell(td, 3);
      }
    }

    // Flash a cell (by toggling a CSS class) a specified number of times.
    function flashCell(element, times) {
      let count = 0;
      const interval = setInterval(() => {
        element.classList.toggle("flash");
        count++;
        if (count >= times * 2) {
          clearInterval(interval);
          element.classList.remove("flash");
        }
      }, 300);
    }

    // Check if there is a winning path from the startCell to targetCell
    // using only cells that have been played and answered correctly.
    function checkWinPath() {
      if (!startCell || !targetCell) return false;
      const N = settings.gridSize;
      const visited = Array.from({ length: N }, () => Array(N).fill(false));
      const queue = [];
      queue.push(startCell);
      visited[startCell.row][startCell.col] = true;
      const directions = [
        { dr: -1, dc: 0 }, { dr: 1, dc: 0 },
        { dr: 0, dc: -1 }, { dr: 0, dc: 1 },
        { dr: -1, dc: -1 }, { dr: -1, dc: 1 },
        { dr: 1, dc: -1 }, { dr: 1, dc: 1 }
      ];
      while (queue.length) {
        const cell = queue.shift();
        if (cell.row === targetCell.row && cell.col === targetCell.col) return true;
        for (let d of directions) {
          const nr = cell.row + d.dr;
          const nc = cell.col + d.dc;
          if (nr >= 0 && nr < N && nc >= 0 && nc < N && !visited[nr][nc]) {
            if (board[nr][nc].played && board[nr][nc].correctAnswered) {
              visited[nr][nc] = true;
              queue.push({ row: nr, col: nc });
            }
          }
        }
      }
      return false;
    }

    /***********************
     * Win / Lose Handling
     ***********************/
    function winGame() {
      // Vibrate on win (if supported)
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }
      document.getElementById("win-message").textContent = getRandomVictoryWord();
      document.getElementById("win-stats").innerHTML = `
        <p>Score: ${score}</p>
        <p>Correct Answers: ${correctCount}</p>
        <p>Incorrect Answers: ${incorrectCount}</p>
        <p>Time Remaining: ${timeRemaining} sec</p>
      `;
      document.getElementById("win-modal").style.display = "block";
      clearInterval(timerInterval);
    }

    function loseGame() {
      document.getElementById("lose-message").textContent = getRandomDefeatWord();
      document.getElementById("lose-stats").innerHTML = `
        <p>Score: ${score}</p>
        <p>Correct Answers: ${correctCount}</p>
        <p>Incorrect Answers: ${incorrectCount}</p>
        <p>Time Remaining: ${timeRemaining} sec</p>
      `;
      document.getElementById("lose-modal").style.display = "block";
      clearInterval(timerInterval);
    }

    function getRandomVictoryWord() {
      const words = ["Victory!", "Success!", "Triumph!", "Win!", "Conquered!"];
      return words[Math.floor(Math.random() * words.length)];
    }

    function getRandomDefeatWord() {
      const words = ["Defeat!", "Wrecked!", "Lost!", "Defeated!", "Down!"];
      return words[Math.floor(Math.random() * words.length)];
    }

    /***********************
     * Status & Timer
     ***********************/
    function updateStatus() {
      document.getElementById("status").textContent = `Time: ${timeRemaining} sec | Score: ${score}`;
    }

    function startTimer() {
      timeRemaining = settings.timerDuration;
      updateStatus();
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateStatus();
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          loseGame();
        }
      }, 1000);
    }

    /***********************
     * Game Start & Initialization
     ***********************/
    function startGame() {
      // Reset game state.
      gameStarted = false;
      score = 0;
      correctCount = 0;
      incorrectCount = 0;
      startCell = null;
      targetCell = null;
      lastPlayedCell = null;
      generateBoard();
      renderBoard();
      startTimer();
    }

    window.onload = () => {
      startGame();
    };

    /***********************
     * Switch Question Button
     ***********************/
    document.getElementById("switch-button").addEventListener("click", () => {
      if (confirm("Switch question?")) {
        if (lastPlayedCell) {
          const cell = board[lastPlayedCell.row][lastPlayedCell.col];
          const newQ = generateDummyQuestion();
          cell.question = newQ.question;
          cell.answers = newQ.answers;
          cell.correct = newQ.correct;
          cell.difficulty = newQ.difficulty;
          cell.topic = newQ.topic;
          document.getElementById("question-text").textContent = cell.question;
          const answersContainer = document.getElementById("answers-container");
          answersContainer.innerHTML = "";
          cell.answers.forEach(answer => {
            const btn = document.createElement("button");
            btn.textContent = answer;
            btn.addEventListener("click", () => processAnswer(lastPlayedCell.row, lastPlayedCell.col, answer));
            answersContainer.appendChild(btn);
          });
          document.getElementById("question-timer").textContent = "Question switched!";
        }
      }
    });

    /***********************
     * Play Again Buttons
     ***********************/
    document.getElementById("play-again-button").addEventListener("click", () => location.reload());
    document.getElementById("play-again-button-lose").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
